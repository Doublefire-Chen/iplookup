# unbound: a local resolver for iplookup's reverse DNS (the hostname key).
# Install as /etc/unbound/unbound.conf.d/iplookup.conf (Debian/Ubuntu's
# unbound.conf includes that directory). See deploy/README.md.
#
# It answers only this machine, and nothing else uses it: iplookup is told
# about it in its own config ([dns] resolver = "127.0.0.1:53"), and the
# system's /etc/resolv.conf is left unchanged. (If systemd-resolved already
# listens on 127.0.0.53:53, there is no clash: this is 127.0.0.1.)
#
# unbound resolves from the root servers itself, so PTR answers don't depend
# on, or leak to, an upstream provider, and their TTLs are honoured.

server:
    # Listen on loopback only.
    interface: 127.0.0.1
    # Optional: also on IPv6 loopback ([dns] resolver = "[::1]:53").
    # interface: ::1
    port: 53

    # Refuse everyone but this machine (also the default, stated here so a
    # later `interface: 0.0.0.0` elsewhere can't open it up).
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow

    # Don't answer id.server / version.server queries.
    hide-identity: yes
    hide-version: yes

    # A cache sized for many distinct PTR names.
    msg-cache-size: 32m
    rrset-cache-size: 64m
    cache-max-negative-ttl: 300
