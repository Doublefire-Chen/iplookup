# nginx site for iplookup on ip.aka.cy and its IPv4-only and IPv6-only
# names. Install as /etc/nginx/sites-available/ip.aka.cy and link it into
# sites-enabled/. See deploy/README.md.
#
# nginx only terminates TLS and answers ACME challenges; every other
# request, on port 80 AND port 443, is proxied to iplookup, which does all
# the routing and serves the web pages itself.
#
# DO NOT add a blanket `return 301 https://...` on port 80 (ADR 0002,
# docs/adr/0002-plain-http-for-api-clients.md): `curl ip.aka.cy` uses http
# and does not follow redirects, so it would print a 301 page instead of
# the Record. iplookup redirects browsers (Accept: text/html) to https
# itself, based on X-Forwarded-Proto, and sends HSTS on https.
#
# One certificate covers all three names, issued and renewed through the
# webroot below (not `certbot --nginx`, which offers to add exactly the
# redirect this file must not have):
#   certbot certonly --webroot -w /var/www/letsencrypt \
#     -d ip.aka.cy -d v4.ip.aka.cy -d v6.ip.aka.cy
# (DNS: ip.aka.cy has A and AAAA, v4.ip.aka.cy only A, v6.ip.aka.cy only
# AAAA, all DNS-only, not proxied by a CDN.)

upstream iplookup {
    server 127.0.0.1:18310;   # = listen in /etc/iplookup/config.toml
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ip.aka.cy v4.ip.aka.cy v6.ip.aka.cy;

    # certbot's webroot: renewals keep working without touching the app.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # Everything else: proxied, not redirected (see above).
    location / {
        proxy_pass http://iplookup;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Host passes through, so the app sees which of the three names
        # was asked for (it builds its https redirects from it).
        proxy_set_header Host $host;
        # The client's address and scheme. iplookup believes these only
        # from trusted_proxies (127.0.0.1 and ::1 in the sample config).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    # nginx 1.18 syntax. On nginx >= 1.25.1 write `listen 443 ssl;` plus
    # `http2 on;` instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ip.aka.cy v4.ip.aka.cy v6.ip.aka.cy;

    ssl_certificate     /etc/letsencrypt/live/ip.aka.cy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip.aka.cy/privkey.pem;
    # If certbot's nginx plugin created these on this server, use them:
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # iplookup sets its own HSTS, CORS and caching headers; don't add or
    # override them here.

    location / {
        proxy_pass http://iplookup;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Host passes through, so the app sees which of the three names
        # was asked for (it builds its https redirects from it).
        proxy_set_header Host $host;
        # The client's address and scheme. iplookup believes these only
        # from trusted_proxies (127.0.0.1 and ::1 in the sample config).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
