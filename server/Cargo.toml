[package]
name = "iplookup"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
hex = "0.4.3"
hickory-resolver = "0.26.3"
humantime = "2.4.0"
ipnet = "2.12.2"
maxminddb = "0.32.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"
